# `docker compose up` starts only Postgres (for running the API and web app locally).
# `docker compose --profile app up --build` runs the whole stack in containers:
#   db → migrate (alembic upgrade head, then exits) → api (:8000) → web (:3000)
# The api/migrate containers read apps/api/.env (R2, Gnani, LLM, …). If DATABASE_URL is set there (e.g. Supabase),
# it is used; otherwise they use the db container below (DEFAULT_DATABASE_URL).

x-api-env: &api-env
  env_file:
    - path: ./apps/api/.env
      required: false
  environment:
    # Only a fallback: an explicit DATABASE_URL in apps/api/.env takes priority.
    DEFAULT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-audio_notes}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-audio_notes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: [app]
    image: audio-notes-api
    build: ./apps/api
    <<: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    image: audio-notes-api
    build: ./apps/api
    <<: *api-env
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    profiles: [app]
    image: audio-notes-web
    build:
      context: ./apps/web
      args:
        # Where the web server forwards /api/* (inside the compose network).
        API_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
